name: logs

config:
  timestamp: timestamp
  labels:
    - hostname
    - service
  tags: 
    - host
  fields: 
    - name: appname
      type: string
    - name: facility
      type: string
    - name: version
      type: int
    - name: severity
      type: string

settings:
  # storage:
    # uri: s3://mi.io/my-bucket # override the global storage.uri
  searcher:
    max_results: 1
    todo: TODO
  ingester:
    num_worker: 3 # number of ingester worker for this table
    batch_size: 1000
    commit_timeout_secs: 5000
  retention:
    period: "90 days"
    schedule: daily

