syntax = "proto3";

package quartzdb;

import "quartzdb.proto";


message PutRequest {
  string table_name = 1;
  // Serialized version of arrow::RecordBatch
  bytes record_batch = 2;
}

message PutResponse {}

message SearchRequest {
    string table_name = 1;
    string query = 2;
}

message SearchResponse {
    // Serialized version of arrow::RecordBatch
    bytes record_batch = 1;
}

service GrpcStorerService {  
    rpc Put(PutRequest) returns (PutResponse);
    rpc Search(SearchRequest) returns (SearchResponse);
}
